name: Simulate Fabric Review and Fix Agent

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create violating notebook and pull request
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="simulation/fabric-agent-${GITHUB_RUN_ID}"
          artifact_name="agent_violation_${GITHUB_RUN_ID}"
          artifact_path="fabric/${artifact_name}.Notebook"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          mkdir -p "$artifact_path"
          cp .github/simulation/violating-order-notebook.py \
            "$artifact_path/notebook-content.py"
          python - "$artifact_path/.platform" "$artifact_name" <<'PY'
          import json
          import sys
          import uuid
          from pathlib import Path

          path = Path(sys.argv[1])
          name = sys.argv[2]
          platform = {
              "$schema": "https://developer.microsoft.com/json-schemas/fabric/gitIntegration/platformProperties/2.0.0/schema.json",
              "metadata": {"type": "Notebook", "displayName": name},
              "config": {"version": "2.0", "logicalId": str(uuid.uuid4())},
          }
          path.write_text(json.dumps(platform, indent=2) + "\n", encoding="utf-8")
          PY

          git add "$artifact_path"
          git commit -m "Add violating Fabric notebook for agent simulation"
          git push --set-upstream origin "$branch"

          cat > /tmp/pr-body.md <<EOF
          ## Agent simulation

          This PR was created by the Fabric agent simulation with an intentionally
          noncompliant notebook. The bot will post its guideline review, push a
          separate repair commit, and leave the corrected PR open for human approval.

          **Do not merge until the repair commit and passing validation are visible.**
          EOF

          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Simulate Fabric agent review and repair" \
            --body-file /tmp/pr-body.md)"
          pr_number="${pr_url##*/}"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Review guideline violations
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          set +e
          python .github/scripts/validate_fabric_notebooks.py \
            > /tmp/findings.log 2>&1
          validator_exit="$?"
          set -e

          if [ "$validator_exit" -ne 1 ]; then
            cat /tmp/findings.log
            echo "Expected the intentionally bad notebook to fail validation."
            exit 1
          fi

          finding_count="$(
            grep -cE ': error \[FAB[0-9]{3}\]' /tmp/findings.log
          )"
          if [ "$finding_count" -eq 0 ]; then
            cat /tmp/findings.log
            echo "Validator failed without reporting guideline findings."
            exit 1
          fi

          {
            echo "## Fabric Notebook Review Agent"
            echo
            echo "**Decision: REQUEST CHANGES**"
            echo
            echo "Found ${finding_count} guideline violations. The fixer agent will now apply a separate repair commit."
            echo
            echo '```text'
            grep -E ': error \[FAB[0-9]{3}\]' /tmp/findings.log
            echo '```'
            echo
            echo "Sources applied:"
            echo "- \`guideline/fabric_project\`"
            echo "- \`guideline/fabric_project_data_eng\`"
            echo "- \`.github/skills/spark-authoring-cli/SKILL.md\`"
            echo "- Spark authoring references named in each finding"
          } > /tmp/review.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/review.md

          bad_sha="$(git rev-parse HEAD)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${bad_sha}" \
            -f state=failure \
            -f context=validate-review-context \
            -f description="${finding_count} Fabric guideline violations found" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Apply fixer agent changes
        env:
          ARTIFACT_PATH: ${{ steps.create.outputs.artifact_path }}
        shell: bash
        run: |
          set -euo pipefail

          cp .github/simulation/fixed-order-notebook.py \
            "$ARTIFACT_PATH/notebook-content.py"
          cp .github/simulation/fixed-customer-notebook.py \
            "fabric/noncompliant_review_test.Notebook/notebook-content.py"

          python .github/scripts/validate_fabric_notebooks.py
          git diff --check

          python -m py_compile \
            "$ARTIFACT_PATH/notebook-content.py" \
            "fabric/noncompliant_review_test.Notebook/notebook-content.py"
          find fabric -type d -name __pycache__ -prune -exec rm -rf {} +

          git add "$ARTIFACT_PATH" \
            "fabric/noncompliant_review_test.Notebook/notebook-content.py"
          git commit -m "Fix Fabric notebook guideline violations"
          git push

      - name: Publish successful agent result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create.outputs.pr_number }}
          PR_URL: ${{ steps.create.outputs.pr_url }}
        shell: bash
        run: |
          set -euo pipefail

          fixed_sha="$(git rev-parse HEAD)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${fixed_sha}" \
            -f state=success \
            -f context=validate-review-context \
            -f description="Fabric fixer agent resolved all findings" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          cat > /tmp/fixed.md <<'EOF'
          ## Fabric Notebook Fixer Agent

          A separate repair commit has resolved all reported `FAB###` findings.

          - Fabric notebook validator: **Pass**
          - Python syntax validation: **Pass**
          - Remaining guideline findings: **0**

          The PR is ready for final human review and approval. The agent will not
          approve or merge it.
          EOF

          gh pr comment "$PR_NUMBER" --body-file /tmp/fixed.md

          {
            echo "## Simulation complete"
            echo
            echo "Pull request: ${PR_URL}"
            echo
            echo "The PR contains the original violating commit, agent review feedback,"
            echo "and a separate repair commit. It remains open for human approval."
          } >> "$GITHUB_STEP_SUMMARY"
