name: PR Check (Fabric)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-review-context:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Fabric review context
        shell: bash
        run: |
          set -euo pipefail

          test -s .github/copilot-instructions.md
          test -s guideline/fabric_project
          test -s guideline/fabric_project_data_eng

          skill_count="$(find .github/skills -mindepth 2 -maxdepth 2 -name SKILL.md -type f | wc -l)"
          if [ "$skill_count" -eq 0 ]; then
            echo "No Fabric skill definitions were found in .github/skills."
            exit 1
          fi

          misspelled_path="guild""eline"
          if grep -R --line-number --fixed-strings "$misspelled_path" .github guideline; then
            echo "Found stale references to the misspelled guideline directory."
            exit 1
          fi

          echo "Validated Fabric review instructions, guidelines, and $skill_count skill definitions."